name: ci

on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'doc/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build & functional tests (container)
        run: |
          docker build -t vmess-ci -f tests/Dockerfile.ci .
          docker run --rm vmess-ci
