name: ci

on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'doc/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build & functional tests (container)
        run: |
          docker run --rm -v "$PWD":/work -w /work ubuntu:22.04 bash tests/run_ci.sh
