name: Build and Publish VLESS Client Image

# 触发：main 分支 push（忽略文档）或手动触发
on:
  push:
    branches:
      - main
    paths-ignore:
      - '*.md'
      - 'doc/**'
      - 'reference/**'

  workflow_dispatch:

env:
  BINARY_NAME: vmess_client
  IMAGE_NAME: vmess_client

jobs:
  build-and-push:
    name: Build Binary & Push Image to GHCR
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write   # 推送 ghcr.io 镜像需要

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            liburing-dev \
            g++-12

      - name: Configure CMake
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=g++-12

      - name: Build client
        run: |
          cmake --build build --target ${{ env.BINARY_NAME }} -j$(nproc)

      - name: Upload binary artifact (备用手动部署用)
        uses: actions/upload-artifact@v4
        with:
          name: vmess_client_binary
          path: build/src/${{ env.BINARY_NAME }}
          retention-days: 7

      - name: Prepare Docker build context
        run: |
          mkdir -p docker-context
          cp build/src/${{ env.BINARY_NAME }} docker-context/
          cp Dockerfile.client docker-context/Dockerfile.client

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push client image
        uses: docker/build-push-action@v5
        with:
          context: ./docker-context
          file: ./docker-context/Dockerfile.client
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:latest
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
